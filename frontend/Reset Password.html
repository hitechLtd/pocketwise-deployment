<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset-Password</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero" style="text-align: center; padding-bottom: 36px">
          <div class="brand" style="justify-content: center">
            <div class="brand-mark">🔒</div>
          </div>
          <h1>Reset Password</h1>
          <p style="margin: 0 auto">Fill In Your New Password</p>
        </div>

        <div class="auth-body">
          <form id="reset-form">
            <div class="field">
              <label for="newPassword">New Password</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="password"
                  id="newPassword"
                  placeholder="Enter New Password"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label for="confirmNewPassword">Confirm Password</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="password"
                  id="confirmNewPassword"
                  placeholder="Confirm New Password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Reset Password
            </button>
          </form>

          <div class="auth-divider">or</div>

          <a href="login.html" class="btn btn-outline btn-block"
            >Back to Login</a
          >
        </div>
      </div>
    </div>
    <!-- Form Verification -->
    <script>
      document.getElementById("reset-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmNewPassword =
          document.getElementById("confirmNewPassword").value;
        if (newPassword !== confirmNewPassword) {
          alert("Passwords don't match — please check and try again.");
          return;
        }
        // Demo-only: goes straight to dashboard, no real account creation.
        window.location.href = "dashboard.html";
      });
    </script>
  </body>
</html>
