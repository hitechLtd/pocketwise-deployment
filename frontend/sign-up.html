<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — PocketWise AI</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero">
          <div class="brand">
            <div class="brand-mark">💼</div>
            <div>
              <div class="brand-name">PocketWise <span>AI</span></div>
              <div class="brand-tag">Your AI Financial Coach</div>
            </div>
          </div>
          <h1>Create Account</h1>
          <p>Join PocketWise AI today and start tracking your finances.</p>
        </div>

        <div class="auth-body">
          <!-- Sign UP FORM -->
          <form id="signup-form">
            <div class="field">
              <label for="fullname">Full Name</label>
              <div class="field-input">
                <span class="field-icon">👤</span>
                <input
                  type="text"
                  id="fullname"
                  placeholder="Enter your full name"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Create a password"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="confirm">Confirm Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="confirm"
                  placeholder="Confirm your password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Sign Up
            </button>
            <p id="message"></p>
          </form>

          <div class="auth-foot">
            Already have an account? <a href="login.html">Login</a>
            
          </div>
        </div>
      </div>
    </div>
    <!-- Form Verification -->
    <script>
      const signupForm = document.getElementById("signup-form");
      const messageElement = document.getElementById("message");

      signupForm.addEventListener("submit", async (event) =>{
        event.preventDefault();

        const fullName = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm").value;

        messageElement.textContent = "";

        if(password !== confirmPassword) {
          messageElement.textContent = "Passwords do not match";
          return;
        }
        const registrationDate = {
          fullName,
          email,
          password
        };

        try {
          const response = await fetch(
            "http://localhost:5000/api/auth/register",
            {
              method: "POST",
              headers: {
                "Content-Type" : "application/json",
              },
              body: JSON.stringify(registrationDate),
            }
          );
          const data = await response.json();

          if(!response.ok) {
            messageElement.textContent = 
              data.message || "Unable to create aaccount.";
              return;
          }
          messageElement.textContent = 
           data.message || "Account created successfully.";

           signupForm.reset();

           setTimeout(() => {
            window.location.href = "login.html";
           }, 1500);
        } catch(error) {
          console.error("Registering error:", error);

          messageElement.textContent = 
           "Could not connect to the server. please try again."
        }
      })
    </script>
  </body>
</html>
